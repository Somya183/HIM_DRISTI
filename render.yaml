services:
  - type: web
    name: himdrishti
    env: python
    buildCommand: "npm install --legacy-peer-deps && cd frontend && npm install --legacy-peer-deps && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
